services:
  conductor-server:
    environment:
      - CONFIG_PROP=config-postgres-redis-opensearch3.properties
      - JAVA_OPTS=-Dpolyglot.engine.WarnInterpreterOnly=false
      - conductor.app.ownerEmailMandatory=false
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - COHERE_API_KEY=${COHERE_API_KEY:-}
    image: conductor:server
    container_name: conductor-server
    build:
      context: ../
      dockerfile: docker/server/Dockerfile
      args:
        YARN_OPTS: ${YARN_OPTS}
        INDEXING_BACKEND: opensearch3
    networks:
      - internal
    ports:
      - 8000:8080
      - 8128:5000
    volumes:
      - ./server/config:/app/config
    healthcheck:
      test: ["CMD", "curl", "-I", "-XGET", "http://localhost:8080/health"]
      interval: 60s
      timeout: 30s
      retries: 12
    links:
      - conductor-postgres:postgresdb
      - conductor-redis:rs
      - conductor-opensearch:os
      - keycloak:keycloak
    depends_on:
      conductor-postgres:
        condition: service_healthy
      conductor-redis:
        condition: service_healthy
      conductor-opensearch:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "1k"
        max-file: "3"

  conductor-postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=conductor
      - POSTGRES_PASSWORD=conductor
    volumes:
      - pgdata-conductor:/var/lib/postgresql/data
    networks:
      - internal
    ports:
      - "5432:5432"
    healthcheck:
      test: timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/5432'
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: "json-file"
      options:
        max-size: "1k"
        max-file: "3"

  conductor-redis:
    image: redis:6.2.3-alpine
    volumes:
      - ../server/config/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - internal
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]

  conductor-opensearch:
    image: opensearchproject/opensearch:3.0.0
    container_name: opensearch-3
    environment:
      - plugins.security.disabled=true
      - cluster.name=opensearch-cluster
      - node.name=conductor-opensearch
      - discovery.seed_hosts=conductor-opensearch
      - cluster.initial_cluster_manager_nodes=conductor-opensearch
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=P4zzW)rd>>123_
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - osdata3-conductor:/usr/share/opensearch/data
    networks:
      - internal
    ports:
      - "9200:9200"
    healthcheck:
      test: curl http://localhost:9200/_cluster/health -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: "json-file"
      options:
        max-size: "1k"
        max-file: "3"

  # Creates the "keycloak" role and database in conductor-postgres if they are missing, plus the
  # read-only "keycloak_reader" role Conductor uses to show who created / updated records, then exits.
  # Runs on every "up", so it also works for an existing data volume (Postgres init scripts only
  # run on an empty one). Keycloak creates its own tables on first start.
  keycloak-db-init:
    image: postgres:16
    environment:
      - PGHOST=conductor-postgres
      - PGUSER=conductor
      - PGPASSWORD=conductor
      - KEYCLOAK_DB_PASSWORD=${WEAVER_KEYCLOAK_DB_PASSWORD:-keycloak}
      - KEYCLOAK_READER_PASSWORD=${WEAVER_KEYCLOAK_READER_PASSWORD:-keycloak_reader}
    entrypoint: ["sh", "-c"]
    command:
      - |
        psql -v ON_ERROR_STOP=1 -d postgres -v pw="$$KEYCLOAK_DB_PASSWORD" -v rpw="$$KEYCLOAK_READER_PASSWORD" <<'SQL'
        SELECT format('CREATE ROLE keycloak LOGIN PASSWORD %L', :'pw')
        WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'keycloak') \gexec
        SELECT format('ALTER ROLE keycloak WITH LOGIN PASSWORD %L', :'pw') \gexec
        SELECT 'CREATE DATABASE keycloak OWNER keycloak'
        WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'keycloak') \gexec
        SELECT format('CREATE ROLE keycloak_reader LOGIN PASSWORD %L', :'rpw')
        WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'keycloak_reader') \gexec
        SELECT format('ALTER ROLE keycloak_reader WITH LOGIN PASSWORD %L', :'rpw') \gexec
        \connect keycloak
        GRANT CONNECT ON DATABASE keycloak TO keycloak_reader;
        GRANT USAGE ON SCHEMA public TO keycloak_reader;
        GRANT SELECT ON ALL TABLES IN SCHEMA public TO keycloak_reader;
        ALTER DEFAULT PRIVILEGES FOR ROLE keycloak IN SCHEMA public GRANT SELECT ON TABLES TO keycloak_reader;
        SQL
    depends_on:
      conductor-postgres:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: conductor-keycloak
    command: start-dev --import-realm
    environment:
      - KEYCLOAK_ADMIN=${WEAVER_KEYCLOAK_ADMIN_USERNAME:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${WEAVER_KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KC_BOOTSTRAP_ADMIN_USERNAME=${WEAVER_KEYCLOAK_ADMIN_USERNAME:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${WEAVER_KEYCLOAK_ADMIN_PASSWORD:-admin}
      - KC_HEALTH_ENABLED=true
      - KC_HTTP_PORT=8080
      - KC_HOSTNAME_STRICT=false
      # Users, sessions and admin-console changes live in the "keycloak" database of conductor-postgres.
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://conductor-postgres:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${WEAVER_KEYCLOAK_DB_PASSWORD:-keycloak}
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully
    volumes:
      - ./keycloak/weaver-realm.json:/opt/keycloak/data/import/weaver-realm.json:ro
      # Weaver login theme; the realm selects it with "loginTheme": "weaver"
      - ./keycloak/themes/weaver:/opt/keycloak/themes/weaver:ro
    ports:
      - "${WEAVER_KEYCLOAK_PORT:-8085}:8080"
    networks:
      - internal
    healthcheck:
      test: timeout 5 bash -c 'cat < /dev/null > /dev/tcp/localhost/8080'
      interval: 10s
      timeout: 5s
      retries: 15
    logging:
      driver: "json-file"
      options:
        max-size: "1k"
        max-file: "3"

volumes:
  pgdata-conductor:
    driver: local
  osdata3-conductor:
    driver: local

networks:
  internal:
