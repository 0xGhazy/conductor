# In-Memory standalone configuration (Zero dependencies, runs anywhere)
weaver.db.type=memory
weaver.queue.type=memory
weaver.indexing.type=memory
weaver.workflow-execution-lock.type=local_only
weaver.external-payload-storage.type=dummy
weaver.file-storage.enabled=false
weaver.app.ownerEmailMandatory=false
loadSample=true

# Metrics & Actuator
management.endpoints.web.exposure.include=health,prometheus
