# In-Memory standalone configuration (Zero dependencies, runs anywhere)
conductor.db.type=memory
conductor.queue.type=memory
conductor.indexing.type=memory
conductor.workflow-execution-lock.type=local_only
conductor.external-payload-storage.type=dummy
conductor.file-storage.enabled=false
conductor.app.ownerEmailMandatory=false
loadSample=true

# Metrics & Actuator
management.endpoints.web.exposure.include=health,prometheus
