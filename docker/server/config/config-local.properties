# Database persistence type (PostgreSQL on localhost)
conductor.db.type=postgres
conductor.external-payload-storage.type=dummy
conductor.file-storage.enabled=false

# Database connectivity (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/conductor
spring.datasource.username=conductor
spring.datasource.password=conductor

# Queue persistence (Redis standalone on localhost)
conductor.queue.type=redis_standalone
conductor.redis.hosts=localhost:6379:us-east-1c
conductor.redis-lock.serverAddress=redis://localhost:6379
conductor.redis.taskDefCacheRefreshInterval=1
conductor.redis.workflowNamespacePrefix=conductor
conductor.redis.queueNamespacePrefix=conductor_queues
conductor.redis.ssl=false

# Workflow execution lock
conductor.workflow-execution-lock.type=redis
conductor.app.workflowExecutionLockEnabled=true
conductor.app.lockTimeToTry=500

# Worker thread configurations
conductor.app.systemTaskWorkerThreadCount=20
conductor.app.systemTaskMaxPollCount=20

# Elasticsearch 8.x indexing on localhost
conductor.indexing.enabled=true
conductor.indexing.type=elasticsearch8
conductor.elasticsearch.url=http://localhost:9200
conductor.elasticsearch.indexName=conductor
conductor.elasticsearch.clusterHealthColor=yellow
conductor.elasticsearch.indexRefreshInterval=1s

# Metrics & Actuator
conductor.metrics-prometheus.enabled=true
management.endpoints.web.exposure.include=health,prometheus
management.health.redis.enabled=true

# Shorten postpone duration
conductor.app.taskExecutionPostponeDuration=10s
conductor.app.ownerEmailMandatory=false
loadSample=true
