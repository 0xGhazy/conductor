# Database persistence type (PostgreSQL)
weaver.db.type=postgres
weaver.external-payload-storage.type=dummy

# Database connectivity (PostgreSQL)
spring.datasource.url=jdbc:postgresql://postgresdb:5432/postgres
spring.datasource.username=conductor
spring.datasource.password=conductor

# Queue persistence (Redis standalone)
weaver.queue.type=redis_standalone
weaver.redis.hosts=rs:6379:us-east-1c
weaver.redis-lock.serverAddress=redis://rs:6379
weaver.redis.taskDefCacheRefreshInterval=1
weaver.redis.workflowNamespacePrefix=conductor
weaver.redis.queueNamespacePrefix=WEAVER_queues
weaver.redis.ssl=false

# Workflow execution lock
weaver.workflow-execution-lock.type=redis
weaver.app.workflowExecutionLockEnabled=true
weaver.app.lockTimeToTry=500

# Worker thread configurations
weaver.app.systemTaskWorkerThreadCount=20
weaver.app.systemTaskMaxPollCount=20

# OpenSearch 3.x indexing
weaver.indexing.enabled=true
weaver.indexing.type=opensearch3
weaver.opensearch.url=http://os:9200
weaver.opensearch.indexPrefix=conductor
weaver.opensearch.indexReplicasCount=0
weaver.opensearch.clusterHealthColor=green

# Metrics
weaver.metrics-prometheus.enabled=true
management.endpoints.web.exposure.include=health,prometheus

# Redis health indicator
management.health.redis.enabled=true

# Load sample kitchen sink workflow
loadSample=true

# Shorten postpone duration to speed up concurrent execution limit tests
weaver.app.taskExecutionPostponeDuration=10s

# External File storage (disabled)
weaver.file-storage.enabled=false

# Who created / updated a record: read from Keycloak's own database (read-only login). Leave the
# URL empty to turn this off; responses then carry only the stored createdBy / updatedBy values.
weaver.audit.user-lookup.url=${WEAVER_AUDIT_USER_LOOKUP_URL:jdbc:postgresql://postgresdb:5432/keycloak}
weaver.audit.user-lookup.username=${WEAVER_AUDIT_USER_LOOKUP_USERNAME:keycloak_reader}
weaver.audit.user-lookup.password=${WEAVER_AUDIT_USER_LOOKUP_PASSWORD:keycloak_reader}
keycloak.realm=${WEAVER_KEYCLOAK_REALM:weaver}
