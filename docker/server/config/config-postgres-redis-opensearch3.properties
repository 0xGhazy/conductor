# Database persistence type (PostgreSQL)
conductor.db.type=postgres
conductor.external-payload-storage.type=dummy

# Database connectivity (PostgreSQL)
spring.datasource.url=jdbc:postgresql://postgresdb:5432/postgres
spring.datasource.username=conductor
spring.datasource.password=conductor

# Queue persistence (Redis standalone)
conductor.queue.type=redis_standalone
conductor.redis.hosts=rs:6379:us-east-1c
conductor.redis-lock.serverAddress=redis://rs:6379
conductor.redis.taskDefCacheRefreshInterval=1
conductor.redis.workflowNamespacePrefix=conductor
conductor.redis.queueNamespacePrefix=conductor_queues
conductor.redis.ssl=false

# Workflow execution lock
conductor.workflow-execution-lock.type=redis
conductor.app.workflowExecutionLockEnabled=true
conductor.app.lockTimeToTry=500

# Worker thread configurations
conductor.app.systemTaskWorkerThreadCount=20
conductor.app.systemTaskMaxPollCount=20

# OpenSearch 3.x indexing
conductor.indexing.enabled=true
conductor.indexing.type=opensearch3
conductor.opensearch.url=http://os:9200
conductor.opensearch.indexPrefix=conductor
conductor.opensearch.indexReplicasCount=0
conductor.opensearch.clusterHealthColor=green

# Metrics
conductor.metrics-prometheus.enabled=true
management.endpoints.web.exposure.include=health,prometheus

# Redis health indicator
management.health.redis.enabled=true

# Load sample kitchen sink workflow
loadSample=true

# Shorten postpone duration to speed up concurrent execution limit tests
conductor.app.taskExecutionPostponeDuration=10s

# External File storage (disabled)
conductor.file-storage.enabled=false

# Who created / updated a record: read from Keycloak's own database (read-only login). Leave the
# URL empty to turn this off; responses then carry only the stored createdBy / updatedBy values.
conductor.audit.user-lookup.url=${CONDUCTOR_AUDIT_USER_LOOKUP_URL:jdbc:postgresql://postgresdb:5432/keycloak}
conductor.audit.user-lookup.username=${CONDUCTOR_AUDIT_USER_LOOKUP_USERNAME:keycloak_reader}
conductor.audit.user-lookup.password=${CONDUCTOR_AUDIT_USER_LOOKUP_PASSWORD:keycloak_reader}
keycloak.realm=${CONDUCTOR_KEYCLOAK_REALM:weaver}
