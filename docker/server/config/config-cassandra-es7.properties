# Database persistence: Cassandra
weaver.db.type=cassandra
weaver.cassandra.hostAddress=cassandradb
weaver.cassandra.port=9042
weaver.cassandra.replicationFactorValue=1
weaver.cassandra.readConsistencyLevel=ONE
weaver.cassandra.writeConsistencyLevel=ONE

# AI integrations: off (Cassandra has no SkillPackageDAO/SkillMetadataDAO implementation, and
# ConductorAgentSpanConfiguration requires both when weaver.integrations.ai.enabled is true,
# which is the default in application.properties)
weaver.integrations.ai.enabled=false

# Task queue: Redis (Cassandra has no native queue implementation)
weaver.queue.type=redis_standalone
weaver.redis.hosts=rs:6379:us-east-1c
weaver.redis-lock.serverAddress=redis://rs:6379
weaver.redis.taskDefCacheRefreshInterval=1
weaver.redis.workflowNamespacePrefix=conductor
weaver.redis.queueNamespacePrefix=WEAVER_queues

weaver.workflow-execution-lock.type=redis
weaver.app.workflowExecutionLockEnabled=true
weaver.app.lockTimeToTry=500

weaver.app.systemTaskWorkerThreadCount=20
weaver.app.systemTaskMaxPollCount=20

# Elasticsearch 7 indexing
weaver.indexing.enabled=true
weaver.indexing.type=elasticsearch
weaver.elasticsearch.url=http://es:9200
weaver.elasticsearch.indexName=conductor
weaver.elasticsearch.version=7
weaver.elasticsearch.clusterHealthColor=yellow

# Metrics
weaver.metrics-prometheus.enabled=true
management.endpoints.web.exposure.include=health,prometheus

# Redis health indicator
management.health.redis.enabled=true

loadSample=true
