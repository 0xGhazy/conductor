# Database persistence type (PostgreSQL)
weaver.db.type=postgres
weaver.external-payload-storage.type=dummy
server.port=${WEAVER_SERVER_PORT:${SERVER_PORT:8080}}

# Database connectivity (PostgreSQL)
spring.datasource.url=${WEAVER_DATASOURCE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://weaver-postgres:5432/weaver}}
spring.datasource.username=${WEAVER_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:weaver}}
spring.datasource.password=${WEAVER_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:weaver}}

# Queue persistence (Redis standalone - password enforced)
weaver.queue.type=${WEAVER_QUEUE_TYPE:redis_standalone}
weaver.redis.hosts=${WEAVER_REDIS_HOSTS:${WEAVER_REDIS_HOST:weaver-redis}:${WEAVER_REDIS_PORT:6379}:${WEAVER_REDIS_RACK:us-east-1c}:${WEAVER_REDIS_PASSWORD}}
weaver.redis.user=${WEAVER_REDIS_USERNAME:default}
weaver.redis-lock.serverAddress=${WEAVER_REDIS_LOCK_SERVER_ADDRESS:redis://${WEAVER_REDIS_HOST:weaver-redis}:${WEAVER_REDIS_PORT:6379}}
weaver.redis-lock.serverUsername=${WEAVER_REDIS_USERNAME:default}
weaver.redis-lock.serverPassword=${WEAVER_REDIS_PASSWORD}
weaver.redis.taskDefCacheRefreshInterval=1
weaver.redis.workflowNamespacePrefix=${WEAVER_REDIS_WORKFLOW_NAMESPACE_PREFIX:weaver}
weaver.redis.queueNamespacePrefix=${WEAVER_REDIS_QUEUE_NAMESPACE_PREFIX:${WEAVER_REDIS_WORKFLOW_NAMESPACE_PREFIX:weaver}_queues}
weaver.redis.ssl=${WEAVER_REDIS_SSL:false}

# Workflow execution lock
weaver.workflow-execution-lock.type=redis
weaver.app.workflowExecutionLockEnabled=true
weaver.app.lockTimeToTry=500

# Worker thread configurations
weaver.app.systemTaskWorkerThreadCount=20
weaver.app.systemTaskMaxPollCount=20

# Elasticsearch 8.x indexing
weaver.indexing.enabled=${WEAVER_INDEXING_ENABLED:true}
weaver.indexing.type=elasticsearch8
weaver.elasticsearch.url=${WEAVER_ELASTICSEARCH_URL:http://es:9200}
weaver.elasticsearch.indexName=${WEAVER_ELASTICSEARCH_INDEX_NAME:conductor}
weaver.elasticsearch.clusterHealthColor=${WEAVER_ELASTICSEARCH_INDEX_CLUSTER_HEALTH_COLOR:${WEAVER_ELASTICSEARCH_CLUSTER_HEALTH_COLOR:yellow}}
weaver.elasticsearch.indexRefreshInterval=1s

# Metrics & Actuator
weaver.metrics-prometheus.enabled=true
management.endpoints.web.exposure.include=health,prometheus
management.health.redis.enabled=true
management.health.keycloak.enabled=true

# Application defaults
loadSample=true
weaver.app.taskExecutionPostponeDuration=10s
weaver.file-storage.enabled=false

# Keycloak Security Configuration
weaver.security.enabled=${WEAVER_SECURITY_ENABLED:false}
weaver.security.client-id=${WEAVER_SECURITY_CLIENT_ID:weaver}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${WEAVER_KEYCLOAK_ISSUER_URI:http://localhost:8085/realms/weaver}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${WEAVER_KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/weaver/protocol/openid-connect/certs}
# Who created / updated a record: read from Keycloak's own database (read-only login). Leave the
# URL empty to turn this off; responses then carry only the stored createdBy / updatedBy values.
weaver.audit.user-lookup.url=${WEAVER_AUDIT_USER_LOOKUP_URL:jdbc:postgresql://postgresdb:5432/keycloak}
weaver.audit.user-lookup.username=${WEAVER_AUDIT_USER_LOOKUP_USERNAME:keycloak_reader}
weaver.audit.user-lookup.password=${WEAVER_AUDIT_USER_LOOKUP_PASSWORD:keycloak_reader}
keycloak.realm=${WEAVER_KEYCLOAK_REALM:weaver}
