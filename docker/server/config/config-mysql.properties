# Database persistence type.
weaver.db.type=mysql


# mysql
spring.datasource.url=jdbc:mysql://mysql:3306/conductor
spring.datasource.username=conductor
spring.datasource.password=conductor

# redis queues
weaver.queue.type=redis_standalone
weaver.redis.hosts=rs:6379:us-east-1c
weaver.redis-lock.serverAddress=redis://rs:6379


# Elastic search instance indexing is enabled.
weaver.indexing.enabled=true
weaver.indexing.type=elasticsearch
weaver.elasticsearch.url=http://es:9200
weaver.elasticsearch.indexName=conductor
weaver.elasticsearch.version=7
weaver.elasticsearch.clusterHealthColor=yellow

# Additional modules for metrics collection exposed to Prometheus (optional)
weaver.metrics-prometheus.enabled=true
management.endpoints.web.exposure.include=prometheus

# Load sample kitchen-sink workflow
loadSample=true

# File storage
weaver.file-storage.enabled=true
weaver.file-storage.type=conductor
