weaver.db.type=memory
# disable trying to connect to redis and use in-memory
weaver.queue.type=xxx
weaver.workflow-execution-lock.type=local_only
weaver.external-payload-storage.type=dummy
weaver.indexing.enabled=true
weaver.indexing.type=postgres

weaver.app.stack=test
weaver.app.appId=conductor

weaver.app.workflow-offset-timeout=30s

weaver.system-task-workers.enabled=false
weaver.app.system-task-worker-callback-duration=0

weaver.app.event-message-indexing-enabled=true
weaver.app.event-execution-indexing-enabled=true

weaver.app.workflow-execution-lock-enabled=false

weaver.app.workflow-input-payload-size-threshold=10KB
weaver.app.max-workflow-input-payload-size-threshold=10240KB
weaver.app.workflow-output-payload-size-threshold=10KB
weaver.app.max-workflow-output-payload-size-threshold=10240KB
weaver.app.task-input-payload-size-threshold=10KB
weaver.app.max-task-input-payload-size-threshold=10240KB
weaver.app.task-output-payload-size-threshold=10KB
weaver.app.max-task-output-payload-size-threshold=10240KB
weaver.app.max-workflow-variables-payload-size-threshold=2KB

weaver.redis.availability-zone=us-east-1c
weaver.redis.data-center-region=us-east-1
weaver.redis.workflow-namespace-prefix=integration-test
weaver.redis.queue-namespace-prefix=integtest

weaver.indexing.index-prefix=conductor
weaver.indexing.cluster-health-color=yellow

management.metrics.export.datadog.enabled=false
