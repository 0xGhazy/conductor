syntax = "proto3";
package weaver.grpc.search;

option java_package = "com.vodafone.vss.weaver.grpc";
option java_outer_classname = "SearchPb";
option go_package = "github.com/conductor-oss/conductor/client/gogrpc/weaver/grpc/search";

message Request {
    int32 start = 1;
    int32 size = 2;
    string sort = 3;
    string free_text = 4;
    string query = 5;
}

