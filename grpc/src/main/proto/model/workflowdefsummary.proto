syntax = "proto3";
package weaver.proto;


option java_package = "com.vodafone.vss.weaver.proto";
option java_outer_classname = "WorkflowDefSummaryPb";
option go_package = "github.com/conductor-oss/conductor/client/gogrpc/weaver/model";

message WorkflowDefSummary {
    string name = 1;
    int32 version = 2;
    int64 create_time = 3;
    int64 update_time = 4;
}
