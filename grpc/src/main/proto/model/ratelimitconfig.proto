syntax = "proto3";
package weaver.proto;


option java_package = "com.vodafone.vss.weaver.proto";
option java_outer_classname = "RateLimitConfigPb";
option go_package = "github.com/conductor-oss/conductor/client/gogrpc/weaver/model";

message RateLimitConfig {
    enum RateLimitPolicy {
        QUEUE = 0;
        REJECT = 1;
    }
    string rate_limit_key = 1;
    int32 concurrent_exec_limit = 2;
    RateLimitConfig.RateLimitPolicy policy = 3;
}
