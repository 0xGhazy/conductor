syntax = "proto3";
package weaver.proto;


option java_package = "com.vodafone.vss.weaver.proto";
option java_outer_classname = "SchemaDefPb";
option go_package = "github.com/conductor-oss/conductor/client/gogrpc/weaver/model";

message SchemaDef {
    enum Type {
        JSON = 0;
        AVRO = 1;
        PROTOBUF = 2;
    }
    string name = 1;
    int32 version = 2;
    SchemaDef.Type type = 3;
}
