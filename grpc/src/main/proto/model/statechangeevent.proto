syntax = "proto3";
package weaver.proto;

import "google/protobuf/struct.proto";

option java_package = "com.vodafone.vss.weaver.proto";
option java_outer_classname = "StateChangeEventPb";
option go_package = "github.com/conductor-oss/conductor/client/gogrpc/weaver/model";

message StateChangeEvent {
    string type = 1;
    map<string, google.protobuf.Value> payload = 2;
}
