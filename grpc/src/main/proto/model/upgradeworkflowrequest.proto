syntax = "proto3";
package weaver.proto;

import "google/protobuf/struct.proto";

option java_package = "com.vodafone.vss.weaver.proto";
option java_outer_classname = "UpgradeWorkflowRequestPb";
option go_package = "github.com/conductor-oss/conductor/client/gogrpc/weaver/model";

message UpgradeWorkflowRequest {
    map<string, google.protobuf.Value> task_output = 4;
    map<string, google.protobuf.Value> workflow_input = 3;
    int32 version = 2;
    string name = 1;
}
