# Load .env file from the repository root directory
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.application.name=weaver
spring.application.version=v2.0 LTS
springdoc.api-docs.path=/api-docs
spring.output.ansi.enabled=ALWAYS
server.forward-headers-strategy=framework

spring.datasource.url=${SPRING_DATASOURCE_URL:${WEAVER_DATABASE_URL:jdbc:postgresql://localhost:5432/weaver}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${WEAVER_DATABASE_USERNAME:weaver}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${WEAVER_DATABASE_PASSWORD:weaver}}
weaver.db.type=${WEAVER_DB_TYPE:postgres}
# Task queues live in Redis (redis_standalone | redis_sentinel | redis_cluster); set postgres to keep them in the DB.
weaver.queue.type=${WEAVER_QUEUE_TYPE:redis_standalone}
weaver.indexing.type=${WEAVER_INDEXING_TYPE:postgres}
weaver.workflow-execution-lock.type=${WEAVER_WORKFLOW_EXECUTION_LOCK_TYPE:local_only}

# Placeholders in workflows and admin configuration (datasources, HTTP connections, saved queries)
#   ${weaver.env.NAME[.json.path][:default]}  reads WEAVER_ENV_NAME from the OS environment, then the
#       JVM system property of the same name, then the default (null if none). In workflows it is
#       resolved when the task is scheduled and stored in task input, so never put secrets in it.
#   ${weaver.secrets.NAME}  reads the secrets table. In workflows it is resolved right before the
#       task runs, is never stored resolved, and resolved values are masked in task output.
weaver.environment.env.prefix=${WEAVER_ENV_PREFIX:WEAVER_ENV_}
weaver.secrets.type=${WEAVER_SECRETS_TYPE:postgres}
# How long a node caches a secret value. Updates/deletes clear the cache on the node that made them;
# other nodes see the change when their entry expires.
weaver.secrets.cache-ttl=${WEAVER_SECRETS_CACHE_TTL:30m}
# SQL run through the REST API (POST /api/databases/{id}/execute and /api/queries/{id}/execute):
# most rows returned (extra rows are cut and the result has truncated=true) and the longest timeout.
# DATABASE tasks in workflows are not limited by these.
weaver.database.execute.max-rows=${WEAVER_DATABASE_EXECUTE_MAX_ROWS:1000}
weaver.database.execute.max-timeout=${WEAVER_DATABASE_EXECUTE_MAX_TIMEOUT:60s}
#loadSample=true
# enable name validation on workflow/task definitions
weaver.app.workflow.name-validation.enabled=false
weaver.app.ownerEmailMandatory=false

# Scheduler
weaver.scheduler.enabled=true

# Workflow Message Queue (WMQ) feature
weaver.workflow-message-queue.enabled=false
weaver.workflow-message-queue.maxQueueSize=1000
weaver.workflow-message-queue.ttlSeconds=86400
weaver.workflow-message-queue.maxBatchSize=100

# System task worker configurations
# weaver.app.taskWorkerConfigs.HTTP.threadCount=20

# Redis cluster connection in SSL mode
#weaver.redis.ssl=false

# weaver.indexing.enabled=false

#Redis configuration details.
#format is host:port:rack separated by semicolon
#Auth is supported. Password is taken from host[0]. format: host:port:rack:password
#weaver.redis.hosts=host1:port:rack;host2:port:rack:host3:port:rack
# The rack must match weaver.redis.availabilityZone below.
weaver.redis.hosts=${WEAVER_REDIS_HOSTS:localhost:6379:us-east-1c}

#namespace for the keys stored in Dynomite/Redis
weaver.redis.workflowNamespacePrefix=

#namespace prefix for the dyno queues
weaver.redis.queueNamespacePrefix=

#no. of threads allocated to dyno-queues
queues.dynomite.threads=10

#non-quorum port used to connect to local redis.  Used by dyno-queues
weaver.redis.queuesNonQuorumPort=22122

# For a single node dynomite or redis server, make sure the value below is set to same as rack specified in the "workflow.dynomite.cluster.hosts" property.
weaver.redis.availabilityZone=us-east-1c
