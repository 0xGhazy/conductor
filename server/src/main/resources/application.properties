# Default Metrics
weaver.metrics-prometheus.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.web.server.request.autotime.percentiles=0.50,0.75,0.90,0.95,0.99
management.endpoint.health.show-details=always

# Optional Metrics Plugins configuration
# See https://docs.micrometer.io/micrometer/reference/implementations.html for configuration properties
management.atlas.metrics.export.enabled=false
management.otlp.metrics.export.enabled=false
management.influx.metrics.export.enabled=false
management.elastic.metrics.export.enabled=false
management.dynatrace.metrics.export.enabled=false
management.new-relic.metrics.export.enabled=false

management.stackdriver.metrics.export.enabled=false
management.stackdriver.metrics.export.projectId=YOUR_PROJECT_ID

management.datadog.metrics.export.enabled=false
management.datadog.metrics.export.apiKey=YOUR_API_KEY

management.statsd.metrics.export.enabled=false
management.cloudwatch.metrics.export.enabled=false
management.cloudwatch.metrics.export.namespace=conductor

management.azuremonitor.metrics.export.enabled=false
management.azuremonitor.metrics.export.instrumentationKey=INSTRUMENTATION_KEY
management.jmx.metrics.export.enabled=false

# When enabled logs metrics as info level logs
weaver.metrics-logger.enabled=false
# Start AI Workers
weaver.integrations.ai.enabled=true
# External MCP servers and Conductor-Agents OpenAPI discovery are default-deny. Configure exact origins
# (for example, https://tools.example.com) before using those integrations. Private addresses stay
# denied even when their origin is listed unless the development-only allow-private-networks flag is set.
#weaver.ai.outbound.allowed-origins=https://tools.example.com
#weaver.ai.outbound.allow-private-networks=false
spring.main.allow-bean-definition-overriding=true

# =============================================================================
# Document Access Policy - Security defaults for DocumentLoader
# =============================================================================
# Prevents reading/writing sensitive files from local filesystem and blocks
# cloud metadata endpoints (AWS, GCP, Azure, Alibaba). Built-in defaults
# cover /etc/passwd, /etc/shadow, /proc/, ~/.ssh/, ~/.aws/, cloud metadata
# IPs (169.254.169.254, metadata.google.internal), and common secret files
# (.env, credentials.json, id_rsa, keystore.jks, etc.).
#
# The file-storage parentDir is automatically included as an allowed directory
# for local filesystem access. Only paths under allowed directories are permitted;
# all others are denied regardless of blocklists.
# To allow additional directories beyond the parentDir (comma-separated):
#weaver.document-access-policy.allowed-directories=/tmp/imports/,/data/shared/
#
# Add custom entries (comma-separated) to extend the built-in blocklists:
#weaver.document-access-policy.blocked-path-prefixes=/custom/sensitive/,/internal/data/
#weaver.document-access-policy.blocked-file-names=secret.yaml,api-key.txt
#weaver.document-access-policy.blocked-hosts=internal.corp.net,10.0.0.1
#
# Emergency override (NOT recommended for production):
weaver.document-access-policy.disabled=false

# =============================================================================
# AI Provider Configuration - Environment Variable Defaults
# =============================================================================
# Providers are automatically enabled when their API key is set.
# Set the standard environment variables below to configure each provider.
# These can be overridden by explicit property values in this file or via
# external configuration (e.g. weaver.properties).
# =============================================================================

# OpenAI (GPT-4o, DALL-E 3, Sora, text-embedding-3-small/large)
weaver.ai.openai.api-key=${OPENAI_API_KEY:}
weaver.ai.openai.organization-id=${OPENAI_ORG_ID:}

# Anthropic (Claude 3.5/4 Sonnet, Claude 3 Opus/Haiku)
weaver.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}

# Mistral AI (Mistral Small/Medium/Large, Mixtral)
weaver.ai.mistral.api-key=${MISTRAL_API_KEY:}

# Cohere (Command, Command-R, embed-english-v3.0)
weaver.ai.cohere.api-key=${COHERE_API_KEY:}

# Grok / xAI (Grok-3, Grok-3-mini)
weaver.ai.grok.api-key=${XAI_API_KEY:${GROK_API_KEY:}}

# Perplexity AI (Sonar, Sonar Pro)
weaver.ai.perplexity.api-key=${PERPLEXITY_API_KEY:}

# HuggingFace (Llama, Mistral, Zephyr)
weaver.ai.huggingface.api-key=${HUGGINGFACE_API_KEY:}

# Stability AI (SD3.5, Stable Image Core, Stable Image Ultra)
weaver.ai.stabilityai.api-key=${STABILITY_API_KEY:}

# Azure OpenAI
weaver.ai.azureopenai.api-key=${AZURE_OPENAI_API_KEY:}
weaver.ai.azureopenai.base-url=${AZURE_OPENAI_ENDPOINT:}
weaver.ai.azureopenai.deployment-name=${AZURE_OPENAI_DEPLOYMENT:}

# AWS Bedrock (Claude, Titan, Llama via AWS)
weaver.ai.bedrock.access-key=${AWS_ACCESS_KEY_ID:}
weaver.ai.bedrock.secret-key=${AWS_SECRET_ACCESS_KEY:}
weaver.ai.bedrock.region=${AWS_REGION:us-east-1}
weaver.ai.bedrock.bearerToken=${AWS_BEARER_TOKEN_BEDROCK:}

# Google Gemini / Vertex AI (Gemini, Veo) - use API key OR GOOGLE_APPLICATION_CREDENTIALS for auth
weaver.ai.gemini.api-key=${GEMINI_API_KEY:}
weaver.ai.gemini.project-id=${GOOGLE_CLOUD_PROJECT:}
weaver.ai.gemini.location=${GOOGLE_CLOUD_LOCATION:us-central1}

# Ollama (local inference server)
weaver.ai.ollama.base-url=${OLLAMA_HOST:http://localhost:11434}

# =============================================================================
# Keycloak / OAuth2 Security Configuration
# =============================================================================
weaver.security.enabled=${WEAVER_SECURITY_ENABLED:false}
weaver.security.client-id=${WEAVER_SECURITY_CLIENT_ID:weaver}
weaver.security.admin-role=${WEAVER_SECURITY_ADMIN_ROLE:WEAVER_admin}
weaver.security.operator-role=${WEAVER_SECURITY_OPERATOR_ROLE:WEAVER_operator}
weaver.security.viewer-role=${WEAVER_SECURITY_VIEWER_ROLE:WEAVER_viewer}
weaver.security.worker-role=${WEAVER_SECURITY_WORKER_ROLE:WEAVER_worker}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${WEAVER_KEYCLOAK_ISSUER_URI:http://localhost:8085/realms/weaver}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${WEAVER_KEYCLOAK_JWK_SET_URI:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs}
# Who created / updated a record: read from Keycloak's own database (read-only login). Leave the
# URL empty to turn this off; responses then carry only the stored createdBy / updatedBy values.
weaver.audit.user-lookup.url=${WEAVER_AUDIT_USER_LOOKUP_URL:jdbc:postgresql://localhost:5432/keycloak}
weaver.audit.user-lookup.username=${WEAVER_AUDIT_USER_LOOKUP_USERNAME:keycloak_reader}
weaver.audit.user-lookup.password=${WEAVER_AUDIT_USER_LOOKUP_PASSWORD:keycloak_reader}
keycloak.realm=${WEAVER_KEYCLOAK_REALM:weaver}
weaver.keycloak.url=${WEAVER_KEYCLOAK_URL:http://localhost:8085}

# Management UI Configuration
weaver.management.ui.port=${WEAVER_MANAGEMENT_UI_PORT:8127}
weaver.management.ui.url=${WEAVER_MANAGEMENT_UI_URL:}
